# Navigation health check — verify all main routes load without errors
# Each test auto-navigates to its start_url.
# Run: llm-browser-testkit run examples/navigation-health.toml

[config]
base_url = "http://localhost:4200"
browser_headless = true
timeout_secs = 30
start_url = "/dashboard"
auto_navigate = true

[[definitions]]
name = "no_errors"
preset = "no_error_on_page"

# ═══ Dashboard ═══

[[test]]
name = "Dashboard"

[[test.steps]]
kind = "navigate"
url = "/dashboard"
wait_after_ms = 2000

[[test.steps]]
kind = "assert"
definition = "no_errors"

[[test.steps]]
kind = "assert"
prompt = "Does the page look like it loaded successfully? Look for a heading, metric cards, or widget sections. Answer PASS if the page is not blank or showing an error."

# ═══ Chats ═══

[[test]]
name = "Chats"
start_url = "/chats"

[[test.steps]]
kind = "assert"
definition = "no_errors"

[[test.steps]]
kind = "assert"
prompt = "Is there a chat room list or a '+ New Room' button visible? Answer PASS if either is present."

