[package]
name = "llm-browser-testkit"
version = "0.10.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/floffel/llm-browser-testkit"
description = "LLM-driven browser test framework — define browser test scenarios in TOML with natural language steps and LLM-powered assertions"
keywords = ["llm", "testing", "browser", "e2e", "integration-testing"]
categories = ["development-tools::testing"]
readme = "README.md"

[features]
default = []
macros = []
mcp-server = []
a2a-server = ["dep:hyper", "dep:hyper-util", "dep:http-body-util"]
azure = []
aws = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws-smithy-runtime-api",
]

[[test]]
name = "macros"
required-features = ["macros"]

[[bin]]
name = "llm-browser-testkit"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
nursery = { level = "warn", priority = -1 }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
headless_chrome = "1"

hyper = { version = "1", features = ["server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# AWS Bedrock provider (feature `aws`): standard credential chain via
# aws-config, SigV4 request signing via aws-sigv4. Versions are pinned at
# the newest releases whose MSRV still fits the crate's rust-version 1.89
# (the Docker image builds on rust:1.89-alpine): aws-config 1.8.13 /
# aws-credential-types 1.2.11 / aws-sigv4 1.3.8 all require rustc 1.88.
aws-config = { version = "=1.8.13", features = ["behavior-version-latest"], optional = true }
aws-credential-types = { version = "=1.2.11", features = ["hardcoded-credentials"], optional = true }
aws-sigv4 = { version = "=1.3.8", optional = true }
# Used only to name the `Identity` type in SigV4 signing params.
aws-smithy-runtime-api = { version = "1", optional = true }

[dev-dependencies]
wiremock = "0.6"
